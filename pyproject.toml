[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-finance-os"
version = "0.1.0"
description = "Deterministic research-to-live quant operating system foundation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "code-romeo" }]
dependencies = [
  "pydantic>=2.8,<3",
  "polars>=1.6,<2",
  "duckdb>=1.1,<2",
  "pyarrow>=17,<22"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
