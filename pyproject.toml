[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-finance-os"
version = "0.1.0"
description = "Deterministic quant research-to-live operating system foundation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "quant-finance-os contributors"}]
dependencies = [
  "duckdb>=1.0.0",
  "pyarrow>=16.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
